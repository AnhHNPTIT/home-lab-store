version: "3.7"
services:
  app:
    image: webhomelabstore
    build:
      args:
        user: sammy
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    container_name: appwhl
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - whl-app

  db:
    image: mysql:8.0
    container_name: dbwhl
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./mysql/data:/var/lib/mysql
    ports:
      - "3308:3306"
    command: --bind-address=0.0.0.0
    networks:
      - whl-app

  nginx:
    image: nginx:alpine
    container_name: nginxwebhomelabs
    restart: unless-stopped
    ports:
      - 8020:80
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
      - ./docker-compose/ssl:/etc/nginx/ssl
    networks:
      - whl-app
      
networks:
  whl-app:
    driver: bridge
